<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Assessor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/lit-html@2.7.0/lit-html.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .clause-cell {
      width: 48px;
      height: 48px;
      cursor: pointer;
    }

    .progress-spinner {
      width: 24px;
      height: 24px;
    }
  </style>
</head>

<body class="container py-4">
  <h1 class="mb-4">Document Assessor</h1>
  <div class="row g-4">
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Upload Documents</h5>
          <input type="file" class="form-control mb-3" id="documentUpload" multiple accept=".pdf,.doc,.docx,.txt">
          <div id="documentList" class="list-group"></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Clauses to Check</h5>
          <div class="input-group mb-3">
            <input type="text" class="form-control" id="clauseInput" placeholder="Enter clause...">
            <button class="btn btn-primary" id="addClause">Add</button>
          </div>
          <div id="clauseList" class="list-group"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="card mt-4">
    <div class="card-body">
      <h5 class="card-title">Assessment Results</h5>
      <div class="table-responsive">
        <div id="resultsTable"></div>
      </div>
    </div>
  </div>
  <script src="script.js" type="module"></script>
</body>

</html>
